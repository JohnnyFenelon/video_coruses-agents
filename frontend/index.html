<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Johnny Agents — Orchestration Engine</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">Johnny Agents</span>
      </div>
      <span class="version">v3.0.0</span>
    </div>
    <nav id="nav">
      <a class="nav-item active" data-route="dashboard" href="#dashboard">
        <span class="nav-icon">⬡</span> Dashboard
      </a>
      <a class="nav-item" data-route="chat" href="#chat">
        <span class="nav-icon">💬</span> AI Chat
      </a>
      <a class="nav-item" data-route="code" href="#code">
        <span class="nav-icon">{}</span> Code Studio
      </a>
      <div class="nav-divider"></div>
      <div class="nav-label">Modes</div>
      <a class="nav-item" data-route="course" href="#course">
        <span class="nav-icon">📘</span> Course Creator
      </a>
      <a class="nav-item" data-route="video" href="#video">
        <span class="nav-icon">🎬</span> Video Studio
      </a>
      <div class="nav-divider"></div>
      <div class="nav-label">System</div>
      <a class="nav-item" data-route="cron" href="#cron">
        <span class="nav-icon">⏰</span> Scheduler
      </a>
      <a class="nav-item" data-route="logs" href="#logs">
        <span class="nav-icon">📋</span> Logs
      </a>
      <a class="nav-item" data-route="settings" href="#settings">
        <span class="nav-icon">⚙</span> Settings
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="status-indicator" id="status-indicator">
        <span class="status-dot"></span>
        <span id="status-text">Ready</span>
      </div>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <h1 id="page-title">Dashboard</h1>
      <div class="topbar-actions">
        <button class="btn btn-sm" id="btn-terminal-toggle" title="Toggle Terminal">⌘ Terminal</button>
        <button class="btn btn-sm btn-primary" id="btn-run" title="Run selected">▶ Run</button>
      </div>
    </header>
    <div id="content">
      <!-- Pages are rendered here by JS -->
    </div>
  </main>

  <div id="terminal-panel">
    <div class="terminal-header">
      <span>Terminal / Logs</span>
      <button id="btn-terminal-close">✕</button>
    </div>
    <div id="terminal-output"></div>
    <div class="terminal-input-line">
      <span class="terminal-prompt">$</span>
      <input type="text" id="terminal-input" placeholder="Type a command..." spellcheck="false" />
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/course.js"></script>
<script src="js/video.js"></script>
</body>
</html>
